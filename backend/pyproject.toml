[project]
name = "stonks-empire-backend"
version = "0.1.0"
description = "Stonks Empire — stock trading utilities API"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic[email]",
    "pydantic-settings",
    "structlog",
    "sentry-sdk[fastapi]",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.13.0",
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "apscheduler>=3.11,<4",
    "redis>=8.1",
    "holidays>=0.108",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "httpx-ws>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "C4",     # comprehensions
    "ASYNC",  # async correctness
    "S",      # bandit (security)
    "RUF",
]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point of a test, and fixture credentials are not secrets.
"tests/**" = ["S101", "S105", "S106"]
"alembic/env.py" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
files = ["app"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
# Alembic revisions are generated; holding them to strict typing buys nothing.
exclude = ["^alembic/versions/"]

# APScheduler 3.x ships no type information, and 4.x (which does) is still
# alpha. Only app/jobs/worker.py imports it, and that module is wiring only.
[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: exercises a real database",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
